name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project (unzip if needed)
        run: |
          if [ -f MessageVault.zip ]; then unzip -q -o MessageVault.zip; fi
          if [ -f MessageVault/settings.gradle.kts ]; then
            echo "PROJ=MessageVault" >> "$GITHUB_ENV"
          else
            echo "PROJ=." >> "$GITHUB_ENV"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MessageVault-APK
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
